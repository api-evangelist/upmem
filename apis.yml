aid: upmem
name: Upmem
description: >-
  UPMEM is a French fabless semiconductor company pioneering Processing-In-Memory
  (PIM). Its Data Processing Units (DPUs) are embedded directly in DRAM on standard
  DIMM modules, putting thousands of programmable cores inside memory to accelerate
  data-intensive workloads such as analytics, genomics, and AI inference. Developers
  program DPUs in C using the UPMEM DPU SDK (LLVM-based compiler, DPU runtime,
  C/C++/Java/Python host libraries, dpu-lldb debugger, and a functional simulator),
  distributed from sdk.upmem.com and an APT PPA. UPMEM publishes no hosted web API;
  its developer surface is the SDK and an open-source GitHub organization. The
  corporate website (www.upmem.com) is offline as of 2026-07-21, while the SDK
  documentation and release archive remain live.
