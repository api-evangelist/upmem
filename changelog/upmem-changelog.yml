- version: 2025.1.0
  date: null
  breaking: false
  highlights:
  - Implement udev cache (improves DPU allocation performance)
  - 'LLDB: reduce memory transfer when transferring unaligned data during debug'
  - 'dpu-diag: option to disable DPUs with IRAM or WRAM defects'
  - Fix conditions where a subset of valid DPUs would become unusable
  - 'upmem_utilities: add pyelftools dependency (dpu_sections, dpu_statistics)'
  - Fix DPU toolchain file for CMake
  deprecations:
  - Systems with Linux kernel older than 6.8 will be deprecated in future releases
  - Ubuntu 22.04 LTS will only be supported with the HWE stack and kernel 6.8
- version: 2024.2.0
  date: null
  breaking: false
  highlights:
  - Implement WRAM access in parallel of DPU execution
  - Add DPU v1B performance counters
  - Add chip versioning tags to DPU binaries
  - dpu.h now exports most of the DPU API (IWYU)
  - Run-time library documentation moved to doxygen format; dark mode docs
  - Document UPMEM PPA and UPMEM_PROFILE
  - 'Functional simulator: remove broken nrDpusPerCi option'
- version: 2024.1.0
